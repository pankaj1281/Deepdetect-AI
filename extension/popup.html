<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deepdetect AI</title>
    <style>
      :root {
        --bg: #0f0f1a;
        --surface: #1a1a2e;
        --border: #2d2d4a;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --fake: #ef4444;
        --real: #22c55e;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 360px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      header h1 {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
      }

      .content { padding: 14px 16px; }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }

      .media-list {
        max-height: 160px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .media-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
      }

      .media-item:last-child { border-bottom: none; }
      .media-item:hover { background: rgba(99,102,241,0.1); }

      .media-item .url {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        color: var(--muted);
      }

      .analyse-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
      }

      .analyse-btn:hover { background: var(--accent-hover); }
      .analyse-btn:disabled { opacity: 0.45; cursor: not-allowed; }

      .result-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 11px;
        font-weight: 700;
      }

      .result-badge.fake { background: rgba(239,68,68,0.15); color: var(--fake); }
      .result-badge.real { background: rgba(34,197,94,0.15); color: var(--real); }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .btn {
        flex: 1;
        padding: 9px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-secondary { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
      .btn-secondary:hover { background: var(--border); color: var(--text); }

      .empty {
        padding: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }

      .status-bar {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 8px 16px;
        font-size: 11px;
        color: var(--muted);
        min-height: 32px;
      }
    </style>
  </head>
  <body>
    <header>
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#6366f1">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2h-2"/>
      </svg>
      <h1>Deepdetect AI</h1>
    </header>

    <div class="content">
      <p class="section-title">Images on this page</p>
      <div class="media-list" id="imageList">
        <div class="empty">Scanning…</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="scanBtn">🔍 Scan Page</button>
        <button class="btn btn-secondary" id="clearBtn">✕ Clear Marks</button>
      </div>
    </div>

    <div class="status-bar" id="statusBar">Ready</div>

    <script src="popup.js"></script>
  </body>
</html>
